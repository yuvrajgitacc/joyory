[project]
name = "joyory-skingenie"
version = "1.0.0"
description = "Joyory SkinGenie — multi-agent smart shopping skincare engine (LJ University Hackathon Task 02)"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "onnxruntime>=1.18.0",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    # NOTE: only ONE opencv build may be installed. skin-tone-classifier
    # requires opencv-python (full), so headless is deliberately NOT listed:
    # installing both overwrites cv2 files and breaks CascadeClassifier.
    # Pinned to 4.x: opencv 5.x removed CascadeClassifier, which stone and
    # the face-aware tone crop depend on.
    # (Linux slim images may need libgl1 for the full build.)
    "opencv-python>=4.9.0.80,<5",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "skin-tone-classifier>=1.2.3",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "huggingface-hub>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/scripts", "backend/tests"]
pythonpath = ["backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.hatch.build.targets.wheel]
packages = ["backend/scripts"]
